<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — The Latrinalia Project</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; }
    .add-pin-btn {
      display: block; width: 100%; margin-top: 6px; padding: 6px;
      background: #222; color: #fff; border: none; cursor: pointer;
      font-family: 'Andale Mono', monospace; font-size: 0.75rem;
    }
    .pin-map-container { display: none; width: 100%; height: 200px; margin-top: 6px; }
    .pin-map-container.visible { display: block; }
    .pin-save-btn {
      display: none; width: 100%; padding: 6px; margin-top: 4px;
      background: #cc2222; color: #fff; border: none; cursor: pointer;
      font-family: 'Andale Mono', monospace; font-size: 0.75rem;
    }
  </style>
</head>
<body class="feed-body">

  <!-- Header -->
  <header class="page-header">
    <div class="header-left">
      <span class="page-label white">FEED</span>
      <button class="menu-toggle white" id="menu-toggle" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <a href="index.html" class="header-center white">THE LATRINALIA PROJECT</a>
    <a href="upload.html" class="upload-btn light">
      <img src="upload-icon.png" alt="Upload">
    </a>
  </header>

  <!-- Dim overlay -->
  <div class="menu-overlay" id="menu-overlay"></div>

  <!-- Nav drawer -->
  <nav class="nav-drawer" id="nav-drawer">
    <button class="menu-close" id="menu-close">✕</button>
    <a href="home.html">HOME</a>
    <a href="data.html">DATA</a>
    <a href="map.html">MAP</a>
    <a href="feed.html">FEED</a>
    <a href="reading-list.html">READING LIST</a>
  </nav>

  <!-- Feed -->
  <div class="feed-container">

    <article class="feed-item">
      <img class="feed-photo" src="hoop-and-toy.jpg" alt="Latrinalia at Hoop & Toy">
      <div class="feed-caption">
        <div class="location">Hoop &amp; Toy (34 Thurloe Pl, SW7 2HQ)</div>
        <div class="timestamp">19:07 &nbsp; 9/2/2026</div>
      </div>
    </article>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDHJ_vW37r4JIFILGKFR36mqNWE2DCzxAo",
      authDomain: "latrinalia-project.firebaseapp.com",
      projectId: "latrinalia-project",
      storageBucket: "latrinalia-project.firebasestorage.app",
      messagingSenderId: "257656095314",
      appId: "1:257656095314:web:bb7e79f96febcab79f158b"
    });
    const db = firebase.firestore();
    const container = document.querySelector('.feed-container');

    db.collection('posts').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
      container.querySelectorAll('.firebase-post').forEach(el => el.remove());
      snapshot.forEach(doc => {
        const entry = doc.data();
        const article = document.createElement('article');
        article.className = 'feed-item firebase-post';
        const photoHTML = entry.photoURL
          ? `<img class="feed-photo" src="${entry.photoURL}" alt="${entry.pub}">`
          : `<div class="feed-photo-placeholder" style="background:#111;font-size:4rem;">📷</div>`;

        const pinSection = (!entry.lat || !entry.lng) ? `
          <button class="add-pin-btn">📍 Add map pin</button>
          <div class="pin-map-container" id="pinmap-${doc.id}"></div>
          <button class="pin-save-btn" id="pinsave-${doc.id}">Save pin to map</button>
        ` : '';

        article.innerHTML = `
          ${photoHTML}
          <div class="feed-caption">
            <div class="location">${entry.address}</div>
            <div class="timestamp">${entry.datetime}</div>
            ${entry.caption ? `<div style="font-size:0.82rem;margin-top:4px;opacity:0.7;">${entry.caption}</div>` : ''}
            ${pinSection}
          </div>`;
        container.appendChild(article);

        // Wire up pin button if this post has no location
        if (!entry.lat || !entry.lng) {
          let leafletMap = null, marker = null, chosenLat = null, chosenLng = null;
          const addBtn = article.querySelector('.add-pin-btn');
          const mapContainer = article.querySelector(`#pinmap-${doc.id}`);
          const saveBtn = article.querySelector(`#pinsave-${doc.id}`);

          addBtn.addEventListener('click', function() {
            mapContainer.classList.toggle('visible');
            if (mapContainer.classList.contains('visible') && !leafletMap) {
              leafletMap = L.map(mapContainer, { center: [51.505, -0.12], zoom: 13 });
              L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap', maxZoom: 19
              }).addTo(leafletMap);
              leafletMap.on('click', function(e) {
                chosenLat = e.latlng.lat;
                chosenLng = e.latlng.lng;
                if (marker) marker.remove();
                marker = L.marker([chosenLat, chosenLng]).addTo(leafletMap);
                saveBtn.style.display = 'block';
              });
            }
            if (mapContainer.classList.contains('visible')) {
              setTimeout(() => leafletMap.invalidateSize(), 100);
            }
          });

          saveBtn.addEventListener('click', async function() {
            if (!chosenLat) return;
            await db.collection('posts').doc(doc.id).update({ lat: chosenLat, lng: chosenLng });
            addBtn.textContent = '✓ Pin saved';
            addBtn.disabled = true;
            mapContainer.classList.remove('visible');
            saveBtn.style.display = 'none';
          });
        }
      });
    });
  </script>
  <script src="menu.js"></script>
</body>
</html>
